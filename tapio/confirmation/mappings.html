<!doctype html><html lang="en"><meta charset="utf-8"><title>Tapio category mapping review</title>
<style>body{font:16px system-ui;max-width:1000px;margin:2rem auto}article{border:1px solid #aaa;padding:1rem;margin:1rem 0}button,select{padding:.5rem;margin:.5rem}pre{white-space:pre-wrap}</style>
<h1>Category mapping candidates</h1><a href="/pilot/confirmation">Transaction queue</a> · <a href="/pilot/confirmation/concepts">Semantic concepts</a> · <a href="/pilot/confirmation/rules">User rules</a>
<p>Category only. Semantic identity needs separate approval. A mapping never determines context or tax deductibility. Insufficient or conflicting observations still block use.</p><p id="status" role="status"></p><button id="refresh">Refresh persisted state</button><div id="cards"></div>
<script>
const node=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e};let data;
async function post(path,body){const r=await fetch('/pilot/confirmation/mappings/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-Tapio-CSRF':data.csrf},body:JSON.stringify(body)});const v=await r.json();if(!r.ok)throw Error(v.detail);return v}
function render(c){const a=node('article','');a.dataset.candidateId=c.id;a.append(node('h2',c.concept+' → '+c.category),node('p','Persisted decision: '+c.decision+' · '+c.authority),node('pre',JSON.stringify({scope:c.scope,support:c.support,conflicts:c.conflicts,impact:c.impact,risk:c.risk},null,2)));let token=null,revising=false;const action=node('select',''),preview=node('button','Preview mapping decision'),apply=node('button','Apply displayed mapping decision'),revise=node('button','REVISE DECISION'),out=node('pre','');for(const x of ['','CONFIRM_MAPPING','REJECT_MAPPING','DEFER_MAPPING']){const o=node('option',x||'Choose action');o.value=x;action.append(o)}for(const x of [action,preview])x.disabled=!data.writes_enabled||c.decision!=='PENDING';apply.disabled=true;revise.hidden=c.decision==='PENDING';revise.disabled=!data.writes_enabled;revise.onclick=()=>{revising=true;for(const x of [action,preview])x.disabled=!data.writes_enabled;revise.disabled=true};action.onchange=()=>{token=null;apply.disabled=true};preview.onclick=async()=>{try{const p=await post('preview',{candidate_id:c.id,action:action.value,expected_state:c.state_version,revise:revising});out.textContent=JSON.stringify(p.candidate,null,2)+'\n'+p.effect;token=p.token;apply.disabled=!data.writes_enabled}catch(e){out.textContent=e.message;apply.disabled=true}};apply.onclick=async()=>{apply.disabled=true;try{const r=await post('commit',{token,explicit_click:'APPLY_MAPPING_DECISION'});a.replaceWith(render(r.record))}catch(e){out.textContent=e.message;if(/STALE|session/i.test(e.message))await load()}};a.append(revise,action,preview,apply,out);return a}
async function load(){try{const r=await fetch('/pilot/confirmation/mappings/cards',{cache:'no-store'});if(!r.ok)throw Error('Mapping review unavailable');data=await r.json();document.getElementById('status').textContent=data.writes_enabled?'Explicit mapping review enabled':'Read-only';document.getElementById('cards').replaceChildren(...data.records.map(render))}catch(e){document.getElementById('status').textContent=e.message}}document.getElementById('refresh').onclick=load;window.addEventListener('pageshow',load);
</script></html>
