<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAPIO · Minimal review</title>
<style>body{font:16px system-ui;max-width:1050px;margin:32px auto;padding:0 20px;background:#f5f7f4;color:#19352b}article{background:white;border:1px solid #ccd7cc;padding:22px;margin:20px 0;border-radius:10px}button,select,input{font:inherit;margin:8px 8px 8px 0;padding:9px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}summary{cursor:pointer}#error{color:#9b2323}label{display:block}.muted{color:#58685f}</style>
<h1>Review</h1><p>Reuse supported decisions without choosing the same labels again. Category-only confirmations leave context unresolved.</p>

<p id="error" role="alert"></p><p id="loading" role="status">Loading current decisions…</p><button id="refresh">Refresh current state</button><div id="summary"></div><h2>Group confirmations</h2><button id="skipped">Show skipped groups</button><div id="groups"></div><h2>Quick confirmations</h2><div id="quick"></div><h2>Requires judgment</h2><p id="budget"></p><div id="individuals"></div><button id="previous">Previous 5</button><button id="more">Next 5</button><details id="saved"><summary>Saved decisions — corrections</summary><div id="saved-cards"></div></details><details><summary>Full queue audit</summary><div id="audit"></div></details>
<script>
const base='/pilot/confirmation/groups';let plan,current,limit=5,offset=0,generation=0,showSkipped=false,dirty=false,loading=null,checking=false,actionBusy=false;
const el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
function button(parent,text,fn){const b=el('button',text);if(text.startsWith('Apply'))b.className='primary';b.onclick=async()=>{if(actionBusy||loading)return;actionBusy=true;b.disabled=true;try{document.querySelector('#error').textContent='';await fn()}catch(e){if(e.message.includes('STALE_')){dirty=false;await load();const savedStatus=document.querySelector('#loading');savedStatus.textContent='Decision saved. Current queue refreshed.';savedStatus.tabIndex=-1;savedStatus.focus();document.querySelector('#error').textContent='The queue changed. Review the refreshed evidence before applying this decision.'}else document.querySelector('#error').textContent=Tapio.error(e.message)}finally{actionBusy=false;b.disabled=false}};parent.append(b);return b}
async function request(path,body){const r=await fetch(base+path,{cache:'no-store',...(body?{method:'POST',headers:{'Content-Type':'application/json','X-Tapio-CSRF':plan.csrf},body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Error(data.detail||r.statusText);return data}
function details(parent,title,data){const d=el('details');d.append(el('summary',title),Tapio.value(data));parent.append(d)}
function individual(cid,parent,sourcePlan=plan,sourceStates=current){const c=sourcePlan.cards.find(c=>c.card_id===cid), a=el('article');parent.append(a);a.append(el('h3',c.transaction.merchant+' · '+c.transaction.date+' · '+c.transaction.amount));
let state=sourceStates[cid];a.append(el('p',c.review_analysis.why_review));
const form=el('div'), preview=el('div');form.className='review-fields';a.append(form,preview);
function render(){form.replaceChildren();preview.replaceChildren();a.append();Tapio.fields(form,['category','context'].map(f=>[f,state[f].value,c.suggestion[f]]),"Original suggestion");const selects={},touched=new Set();
for(const [f,options] of Object.entries({category:CATEGORIES,context:['PERSONAL','PROPERTY','FORESTRY','UNKNOWN']})){const label=el('label',f+' '),select=el('select');select.append(new Option('Unresolved',''));options.forEach(v=>select.append(new Option(Tapio.label(v),v)));select.setAttribute('aria-label',f);select.value=state[f].value??'';select.onchange=()=>{dirty=true;touched.add(f);preview.replaceChildren()};label.append(select);form.append(label);selects[f]=select}
const reasonLabel=el('label','Correction reason (when changing a saved decision)');reasonLabel.hidden=!['category','context'].some(f=>state[f].authority==='HUMAN_CONFIRMED');const reason=el('input');reason.type='text';reason.setAttribute('aria-label','Correction reason');reason.placeholder='Explain the correction';reasonLabel.append(reason);reason.oninput=()=>{dirty=true;preview.replaceChildren()};form.append(reasonLabel);
button(form,'Use shown suggestion',async()=>{dirty=true;for(const f of ['category','context'])if(c.suggestion[f]&&!state[f].value){selects[f].value=c.suggestion[f];touched.add(f)}preview.replaceChildren()});
button(form,'Preview selected fields',async()=>{dirty=true;const fields=Object.fromEntries([...touched].filter(f=>selects[f].value).map(f=>[f,selects[f].value]));const p=await request('/individual/preview',{plan_id:sourcePlan.plan_id,selection:{card_id:cid,action:'CHANGE',fields,correction_reason:reason.value,review_version:state.review_version,touched_fields:[...touched],explicit_unknown_fields:[...touched].filter(f=>fields[f]==='UNKNOWN')}});Tapio.preview(preview,p.would_change,p.untouched_fields);const apply=button(preview,'Apply displayed changes',async()=>{const result=await request('/individual/commit',{plan_id:sourcePlan.plan_id,commit:{token:p.token,explicit_click:'APPLY_DISPLAYED_CHANGES'}});state=result.authoritative;remember(sourcePlan.plan_id,[cid]);dirty=false;await load();const savedStatus=document.querySelector('#loading');savedStatus.textContent='Decision saved. Current queue refreshed.';savedStatus.tabIndex=-1;savedStatus.focus()});apply.disabled=!plan.writes_enabled});}
render();details(a,'Suggestion and evidence',{suggestion:c.suggestion,history:c.review_analysis.history,identity:c.identity_resolution,purpose_review_required:c.purpose_review_required,blocked:c.blocked_generalizations,warnings:c.warnings,source:c.source_messages,rules:c.user_rules,semantic:c.semantic_concepts,receipt:c.receipt_evidence});}
const CATEGORIES=["ELECTRICITY", "FORESTRY_SERVICE", "FUEL", "GRID_DISTRIBUTION", "GROCERIES", "INSURANCE", "MAINTENANCE", "OTHER", "SUBSCRIPTION", "TAX", "TIMBER_INCOME", "TRANSFER", "TRAVEL", "UNKNOWN"];
function renderGroups(){const groups=document.querySelector('#groups'),quick=document.querySelector('#quick');groups.replaceChildren();quick.replaceChildren();for(const g of plan.groups){if(!showSkipped&&plan.skipped_group_ids?.includes(g.id))continue;const root=g.card_ids.length===1?quick:groups;const a=el('article');root.append(a);a.append(el('h3',g.entities.join(', ')+' · '+g.card_ids.length+' transactions'),el('p',Tapio.label(g.reason)+' · '+g.date_range.join(' — ')),el('p','Proposed: '+Object.entries(g.fields).map(([k,v])=>Tapio.label(k)+': '+Tapio.label(v)).join(' · ')),el('p',Tapio.label(g.conflict_status)));const memberTable=el('div');memberTable.className='table-scroll';const table=el('table');table.innerHTML='<thead><tr><th scope=col>Transaction</th><th scope=col>Date</th><th scope=col>Amount</th></tr></thead>';const tbody=el('tbody');for(const cid of g.card_ids){const record=plan.cards.find(c=>c.card_id===cid)?.transaction;if(record){const row=el('tr');row.append(el('td',record.merchant),el('td',record.date));const amount=el('td',Tapio.amount(record.amount)+' '+(record.currency||'EUR'));amount.className='num';row.append(amount);tbody.append(row)}}table.append(tbody);memberTable.append(table);a.append(memberTable);details(a,'Why these transactions are grouped · evidence',g);const preview=el('div'),members=el('div');
button(a,g.card_ids.length===1?'Use known decision — preview':'Confirm group — preview',async()=>{dirty=true;const sourcePlan=plan;const p=await request('/preview',{plan_id:sourcePlan.plan_id,group_id:g.id});preview.replaceChildren(el('h4','Changes to '+p.group.transaction_ids.length+' transactions'));p.previews.forEach((v,i)=>{const block=el('div');block.append(el('p','Transaction '+p.group.transaction_ids[i]));const change=el('div');Tapio.preview(change,v.would_change);block.append(change);preview.append(block)});const apply=button(preview,'Apply displayed group',async()=>{await request('/commit',{plan_id:sourcePlan.plan_id,token:p.token,explicit_click:'APPLY_DISPLAYED_GROUP'});remember(sourcePlan.plan_id,g.card_ids);dirty=false;await load();const savedStatus=document.querySelector('#loading');savedStatus.textContent='Decision saved. Current queue refreshed.';savedStatus.tabIndex=-1;savedStatus.focus()});apply.disabled=!plan.writes_enabled});
button(a,'Open individuals',async()=>{current=await request('/current?plan_id='+plan.plan_id);members.replaceChildren();g.card_ids.forEach(cid=>individual(cid,members))});button(a,'Skip group',async()=>{await request('/skip',{plan_id:plan.plan_id,group_id:g.id});plan.skipped_group_ids??=[];plan.skipped_group_ids.push(g.id);a.remove()});a.append(preview,members)}for(const [root,text] of [[groups,'No grouped confirmations need action.'],[quick,'No quick confirmations need action.']])if(!root.children.length)root.append(el('p',text))}
function renderIndividuals(){const root=document.querySelector('#individuals');root.replaceChildren();const pending=plan.individual_ids.filter(cid=>!['category','context'].every(f=>current[cid][f].authority==='HUMAN_CONFIRMED'&&current[cid][f].value!==null));pending.slice(offset,offset+limit).forEach(cid=>individual(cid,root));if(!pending.length)root.append(el('p','Nothing needs your judgment. New transactions will appear here when they need a decision.'));document.querySelector('#budget').textContent=`Showing ${Math.min(limit,Math.max(0,pending.length-offset))} of ${pending.length} individual cases, ordered by information value.`;document.querySelector('#more').hidden=offset+limit>=pending.length;document.querySelector('#previous').hidden=offset===0}
function load(){if(loading)return loading;loading=loadCurrent().finally(()=>{loading=null});return loading}
async function loadCurrent(){const run=++generation;try{const saved=new URLSearchParams(location.search).get('plan_id');const next=await request('/cards'+(saved?'?plan_id='+encodeURIComponent(saved):''));const states=await request('/current?plan_id='+next.plan_id);if(run!==generation)return;plan=next;current=states;offset=0;history.replaceState(null,'','?plan_id='+plan.plan_id);document.querySelector('#error').textContent='';document.querySelector('#summary').replaceChildren(el('p',`${plan.summary.total_pending} pending transactions · ${plan.summary.groups} confirmation sets covering ${plan.summary.groupable_transactions} transactions · ${plan.summary.individual_reviews_remaining} individual cases remain`),el('p',`Estimated actions: ${plan.summary.manual_actions_before} → ${plan.summary.manual_actions_after} (${plan.summary.estimated_reduction_percent}% reduction). Includes all remaining cases, not just the first five.`),el('p',plan.writes_enabled?'Preview before every apply.':'Writes disabled pending verification.'));Tapio.show(document.querySelector('#audit'),{transactions:plan.cards.map(c=>({id:c.transaction.id,entity:c.identity_key,...c.review_analysis})),excluded:plan.excluded});renderGroups();renderIndividuals();await renderSaved();document.body.dataset.loaded='true';document.querySelector('#loading').textContent='Current decisions loaded.'}catch(e){document.querySelector('#error').textContent=Tapio.error(e.message);document.querySelector('#loading').textContent='Review could not be loaded. Refresh to try again.'}}
document.querySelector('#skipped').onclick=()=>{if(!plan)return;showSkipped=!showSkipped;document.querySelector('#skipped').textContent=showSkipped?'Hide skipped groups':'Show skipped groups';renderGroups()};document.querySelector('#refresh').onclick=()=>{if(actionBusy||loading)return;dirty=false;history.replaceState(null,'',location.pathname);load()};document.querySelector('#more').onclick=()=>{if(!plan)return;offset+=5;renderIndividuals()};document.querySelector('#previous').onclick=()=>{if(!plan)return;offset=Math.max(0,offset-5);renderIndividuals()};window.addEventListener('pageshow',load);window.addEventListener('focus',checkCurrent);setInterval(checkCurrent,15000);
function remember(id,ids){const saved=JSON.parse(sessionStorage.getItem('tapio-saved')||'{}');saved[id]=[...new Set([...(saved[id]||[]),...ids])];sessionStorage.setItem('tapio-saved',JSON.stringify(saved))}
async function renderSaved(){const root=document.querySelector('#saved-cards');root.replaceChildren();const saved=JSON.parse(sessionStorage.getItem('tapio-saved')||'{}');for(const [id,ids] of Object.entries(saved)){const p=await request('/saved?plan_id='+id),states=await request('/current?plan_id='+id);for(const cid of ids)individual(cid,root,p,states)}}
async function checkCurrent(){if(!plan||loading||checking||actionBusy)return;checking=true;try{const status=await request('/status?plan_id='+plan.plan_id);if(!status.current){if(dirty){document.querySelector('#error').textContent='New decisions are available. Your selection is preserved. The queue changed; refresh and preview it again before applying.'}else await load()}}catch(e){document.querySelector('#error').textContent=e.message}finally{checking=false}}
</script></html>
