<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAPIO · Minimal review</title>
<style>body{font:16px system-ui;max-width:1050px;margin:32px auto;padding:0 20px;background:#f5f7f4;color:#19352b}article{background:white;border:1px solid #ccd7cc;padding:22px;margin:20px 0;border-radius:10px}button,select,input{font:inherit;margin:8px 8px 8px 0;padding:9px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}summary{cursor:pointer}#error{color:#9b2323}label{display:block}.muted{color:#58685f}</style>
<h1>Review what needs your judgment</h1><p>Confirm repeated cases together. Category-only groups leave context unresolved.</p>
<nav><a href="/pilot/confirmation">Previous review window</a> · <a href="/pilot/confirmation/concepts">Concepts</a> · <a href="/pilot/confirmation/rules">User rules</a></nav>
<p id="error" role="alert"></p><button id="refresh">Refresh current state</button><div id="summary"></div><h2>Grouped confirmations</h2><div id="groups"></div><h2>Informative individual reviews</h2><p id="budget"></p><div id="individuals"></div><button id="more">Show 10 more</button><details><summary>Full queue audit</summary><pre id="audit"></pre></details>
<script>
const base='/pilot/confirmation/groups';let plan,current,limit=10,generation=0;
const el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
function button(parent,text,fn){const b=el('button',text);b.onclick=async()=>{b.disabled=true;try{document.querySelector('#error').textContent='';await fn()}catch(e){document.querySelector('#error').textContent=e.message}finally{b.disabled=false}};parent.append(b);return b}
async function request(path,body){const r=await fetch(base+path,{cache:'no-store',...(body?{method:'POST',headers:{'Content-Type':'application/json','X-Tapio-CSRF':plan.csrf},body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Error(data.detail||r.statusText);return data}
function details(parent,title,data){const d=el('details');d.append(el('summary',title),el('pre',JSON.stringify(data,null,2)));parent.append(d)}
function individual(cid,parent){const c=plan.cards.find(c=>c.card_id===cid), a=el('article');parent.append(a);a.append(el('h3',c.transaction.merchant+' · '+c.transaction.date+' · '+c.transaction.amount));
let state=current[cid];a.append(el('p','Transaction ID: '+c.transaction.id));a.append(el('p',c.review_analysis.reason+' · novelty '+c.review_analysis.novelty_score));
const form=el('div'), preview=el('div');a.append(form,preview);
function render(){form.replaceChildren();preview.replaceChildren();a.append();form.append(el('p','Current confirmed values: '+JSON.stringify({category:state.category.value,context:state.context.value})));const selects={},touched=new Set();
for(const [f,options] of Object.entries({category:CATEGORIES,context:['PERSONAL','PROPERTY','FORESTRY','UNKNOWN']})){const label=el('label',f+' '),select=el('select');select.append(new Option('Unresolved',''));options.forEach(v=>select.append(new Option(v,v)));select.value=state[f].value??'';select.onchange=()=>{touched.add(f);preview.replaceChildren()};label.append(select);form.append(label);selects[f]=select}
const reason=el('input');reason.placeholder='Reason for an individual correction';reason.oninput=()=>preview.replaceChildren();form.append(reason);
button(form,'Use shown suggestion',async()=>{for(const f of ['category','context'])if(c.suggestion[f]&&!state[f].value){selects[f].value=c.suggestion[f];touched.add(f)}preview.replaceChildren()});
button(form,'Preview selected fields',async()=>{const fields=Object.fromEntries([...touched].filter(f=>selects[f].value).map(f=>[f,selects[f].value]));const p=await request('/individual/preview',{plan_id:plan.plan_id,selection:{card_id:cid,action:'CHANGE',fields,correction_reason:reason.value,review_version:state.review_version,touched_fields:[...touched],explicit_unknown_fields:[...touched].filter(f=>fields[f]==='UNKNOWN')}});preview.replaceChildren(el('pre',JSON.stringify({transaction_id:c.transaction.id,changes:p.would_change,untouched:p.untouched_fields},null,2)));const apply=button(preview,'Apply displayed changes',async()=>{const result=await request('/individual/commit',{plan_id:plan.plan_id,commit:{token:p.token,explicit_click:'APPLY_DISPLAYED_CHANGES'}});state=result.authoritative;current[cid]=state;render();form.prepend(el('p','Saved. You can correct this transaction here.'))});apply.disabled=!plan.writes_enabled});}
render();details(a,'Suggestion and evidence',{suggestion:c.suggestion,history:c.review_analysis.history,warnings:c.warnings,source:c.source_messages,rules:c.user_rules,semantic:c.semantic_concepts,receipt:c.receipt_evidence});}
const CATEGORIES=["ELECTRICITY", "FORESTRY_SERVICE", "FUEL", "GRID_DISTRIBUTION", "GROCERIES", "INSURANCE", "MAINTENANCE", "OTHER", "SUBSCRIPTION", "TAX", "TIMBER_INCOME", "TRANSFER", "TRAVEL", "UNKNOWN"];
function renderGroups(){const root=document.querySelector('#groups');root.replaceChildren();for(const g of plan.groups){const a=el('article');root.append(a);a.append(el('h3',g.entities.join(', ')+' · '+g.card_ids.length+' transactions'),el('p',g.reason+' · '+g.date_range.join(' — ')),el('p','Proposed: '+JSON.stringify(g.fields)),el('p',g.conflict_status));details(a,'All affected transactions, amounts and evidence',g);const preview=el('div'),members=el('div');
button(a,'Confirm group — preview',async()=>{const p=await request('/preview',{plan_id:plan.plan_id,group_id:g.id});preview.replaceChildren(el('pre',JSON.stringify({transaction_ids:p.group.transaction_ids,fields:p.group.fields,changes:p.previews.map(v=>v.would_change)},null,2)));const apply=button(preview,'Apply displayed group',async()=>{await request('/commit',{plan_id:plan.plan_id,token:p.token,explicit_click:'APPLY_DISPLAYED_GROUP'});preview.replaceChildren(el('p','Group saved. Open individuals below to correct any decision.'));current=await request('/current?plan_id='+plan.plan_id);members.replaceChildren();g.card_ids.forEach(cid=>individual(cid,members))});apply.disabled=!plan.writes_enabled});
button(a,'Open individuals',async()=>{current=await request('/current?plan_id='+plan.plan_id);members.replaceChildren();g.card_ids.forEach(cid=>individual(cid,members))});button(a,'Skip group',async()=>{await request('/skip',{plan_id:plan.plan_id,group_id:g.id});a.remove()});a.append(preview,members)}}
function renderIndividuals(){const root=document.querySelector('#individuals');root.replaceChildren();plan.individual_ids.slice(0,limit).forEach(cid=>individual(cid,root));document.querySelector('#budget').textContent=`Showing ${Math.min(limit,plan.individual_ids.length)} of ${plan.individual_ids.length} individual cases, ordered by information value.`;document.querySelector('#more').hidden=limit>=plan.individual_ids.length}
async function load(){const run=++generation;try{const next=await request('/cards');const states=await request('/current?plan_id='+next.plan_id);if(run!==generation)return;plan=next;current=states;document.querySelector('#summary').replaceChildren(el('pre',JSON.stringify(plan.summary,null,2)),el('p',plan.writes_enabled?'Preview before every apply.':'Writes disabled pending verification.'));document.querySelector('#audit').textContent=JSON.stringify({transactions:plan.cards.map(c=>({id:c.transaction.id,entity:c.identity_key,...c.review_analysis})),excluded:plan.excluded},null,2);renderGroups();renderIndividuals()}catch(e){document.querySelector('#error').textContent=e.message}}
document.querySelector('#refresh').onclick=load;document.querySelector('#more').onclick=()=>{limit+=10;renderIndividuals()};window.addEventListener('pageshow',load);
</script></html>
