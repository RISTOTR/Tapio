<!doctype html><html lang="en"><meta charset="utf-8"><title>Tapio human review</title>
<style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:1rem}article{border:1px solid #aaa;padding:1rem;margin:1rem 0}label{display:block;margin:.7rem 0}button,select{padding:.5rem;margin:.3rem}pre{white-space:pre-wrap}textarea{width:95%}.state{font-weight:bold}details{margin:.8rem 0}</style>
<h1>Individual review</h1>
<div id="batch"></div><p id="progress" class="review-guidance"></p><p class="review-guidance">Review category and context independently. Preview changes before applying them. Tax treatment remains a separate human decision.</p>
<button id="refresh" type="button">Refresh current decisions</button><p id="status" role="status" class="review-guidance">Loading…</p><div id="cards"></div>
<script>
const el=id=>document.getElementById(id), make=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
const categories=['ELECTRICITY','GRID_DISTRIBUTION','FORESTRY_SERVICE','TIMBER_INCOME','TAX','GROCERIES','FUEL','INSURANCE','MAINTENANCE','TRANSFER','SUBSCRIPTION','TRAVEL','OTHER','UNKNOWN'];
const fields=['category','context'];let csrf='',generation=0;
async function get(path){const r=await fetch('/pilot/confirmation/'+path,{cache:'no-store'});if(!r.ok)throw Error('Current review state unavailable');return r.json()}
async function post(path,body){const r=await fetch('/pilot/confirmation/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-Tapio-CSRF':csrf},body:JSON.stringify(body)});const v=await r.json();if(!r.ok)throw Error(v.detail||'Request failed');return v}
function renderCard(c,authoritative,writable,onSaved){
 if(!authoritative||fields.some(f=>!authoritative[f]))throw Error('Authoritative current decision missing');
 const a=make('article','');a.dataset.cardId=c.card_id;a.dataset.transactionId=authoritative.transaction_id;
 const heading=make('div','');heading.className='transaction-heading';heading.append(make('h2',c.transaction.merchant),make('p',`${c.transaction.date} · ${c.transaction.amount} ${c.transaction.currency||'EUR'}`));a.append(heading);
 const status=make('p',Tapio.label(c.write_state));status.className='state';status.setAttribute('role','status');a.append(status);
 const decision=make('div','');Tapio.fields(decision,fields.map(f=>[f,authoritative[f].value,c.suggestion[f]]),"Original suggestion");a.append(decision);
 const current=make('p','');current.className='decision-meta';for(const f of fields){const span=make('span',`${Tapio.label(f)}: ${Tapio.label(authoritative[f].value)} · ${Tapio.label(authoritative[f].field_status)} · ${Tapio.label(authoritative[f].authority)} `);span.dataset.currentField=f;current.append(span)}
 const audit=make('details','');audit.append(make('summary','Authority and decision history'),current,make('p',`Review version: ${authoritative.review_version} · Audit event: ${authoritative.audit_event_id||'None'}`));a.append(audit);
 const evidence=make('details','');evidence.append(make('summary','Evidence and original suggestion'));
 for(const key of ['source_messages','reasons','warnings','evidence','document_evidence','receipt_evidence','semantic_concepts','concept_candidates','user_rules','user_rule_conflicts','blocked_generalizations','uncertainty_history','review_signals','abstention_reasons'])if(c[key]){const section=make('section','');section.append(make('h3',Tapio.label(key)),Tapio.value(c[key]));evidence.append(section)};a.append(evidence);
 const form=make('form','');form.autocomplete='off';const action=make('select','');action.setAttribute('aria-label','Action');
 const addOption=(s,v,label)=>{const o=make('option',label);o.value=v;s.append(o)};addOption(action,'','Choose an action');
 const supported=fields.filter(f=>authoritative[f].value===null&&c.suggestion[f]!=null&&c.suggestion[f]!=='UNKNOWN');
 for(const f of supported)addOption(action,'CONFIRM_'+f.toUpperCase(),'CONFIRM SUGGESTED '+f.toUpperCase());if(supported.length===2)addOption(action,'CONFIRM_BOTH','CONFIRM BOTH');
 addOption(action,'CHANGE','CHANGE — choose labels yourself');addOption(action,'SKIP','SKIP — no classification');form.append(action);
 const controls={},dirty=new Set(),unknownSelections=new Set();let token=null;const fieldControls=make('div','');fieldControls.className='field-controls';form.append(fieldControls);
 for(const f of fields){const label=make('label','Select '+f+': '),check=make('input',''),select=make('select','');check.type='checkbox';check.setAttribute('aria-label','Include '+f);select.setAttribute('aria-label',f);select.autocomplete='off';addOption(select,'','Unresolved — choose a value');for(const v of f==='category'?categories:['PERSONAL','PROPERTY','FORESTRY','UNKNOWN'])addOption(select,v,v);
 const value=authoritative[f].value??'';for(const o of select.options)o.defaultSelected=o.value===value;select.value=value;check.checked=false;check.disabled=select.disabled=true;
 select.addEventListener('change',()=>{dirty.add(f);if(select.value==='UNKNOWN')unknownSelections.add(f);else unknownSelections.delete(f);token=null;apply.disabled=true});label.prepend(check);label.append(select);label.hidden=true;fieldControls.append(label);controls[f]={check,select,label};}
 const noteLabel=make('label','Correction reason');const note=make('textarea','');noteLabel.append(note);note.maxLength=500;note.setAttribute('aria-label','Correction reason');note.placeholder='Reason (required for correcting a previous confirmation)';note.hidden=true;form.append(noteLabel);noteLabel.hidden=true;
 const preview=make('button','Preview — no write');preview.className='primary';preview.type='submit';const apply=make('button','Apply displayed changes');apply.type='button';apply.className='primary';apply.disabled=true;
 const output=make('div',''),message=make('p','');message.setAttribute('role','status');message.dataset.message='true';
 const invalidate=()=>{token=null;apply.disabled=true};form.addEventListener('input',invalidate);form.addEventListener('change',invalidate);
 action.onchange=()=>{note.hidden=noteLabel.hidden=!(action.value && action.value!=='SKIP' && (action.value==='CHANGE'||fields.some(f=>authoritative[f].authority==='HUMAN_CONFIRMED')));dirty.clear();unknownSelections.clear();for(const [f,v] of Object.entries(controls)){const chosen=action.value==='CONFIRM_BOTH'||action.value==='CONFIRM_'+f.toUpperCase();v.label.hidden=action.value!=='CHANGE';v.check.checked=chosen;v.check.disabled=action.value!=='CHANGE';v.select.disabled=action.value!=='CHANGE';v.select.value=chosen?c.suggestion[f]:(authoritative[f].value??'')}invalidate()};
 form.onsubmit=async e=>{e.preventDefault();invalidate();if(!action.value){message.textContent='Choose an action first.';return}const selected={};
 try{if(action.value!=='SKIP')for(const [f,v] of Object.entries(controls))if(v.check.checked){if(v.select.value==='')throw Error('Choose a value or leave the field unchecked.');const changed=v.select.value!==authoritative[f].value;if(changed&&action.value==='CHANGE'&&!dirty.has(f))throw Error('UNCONFIRMED_UI_STATE_CHANGE');if(changed&&v.select.value==='UNKNOWN'&&!unknownSelections.has(f))throw Error('UNCONFIRMED_UI_STATE_CHANGE');selected[f]=v.select.value;}
 const p=await post('preview',{card_id:c.card_id,action:action.value.startsWith('CONFIRM')?'CONFIRM':action.value,fields:selected,correction_reason:note.value,review_version:authoritative.review_version,touched_fields:[...dirty],explicit_unknown_fields:[...unknownSelections]});Tapio.preview(output,p.would_change);token=p.token;apply.disabled=!writable||!p.writes_enabled;message.textContent='Preview only. Review these changes, then apply.';
 }catch(error){message.textContent=Tapio.error(error.message);if(/STALE/.test(error.message)){status.textContent='STALE — refresh current decisions';preview.disabled=true}}};
 apply.onclick=async()=>{if(!token)return;apply.disabled=true;preview.disabled=true;try{const result=await post('commit',{token,explicit_click:'APPLY_DISPLAYED_CHANGES'});if(!result.authoritative)throw Error('Missing canonical save response; refresh before retrying.');const updated={...c,write_state:result.status==='SKIPPED'?'SKIPPED':action.value==='CHANGE'?'CHANGED':'CONFIRMED'};const replacement=renderCard(updated,result.authoritative,writable,onSaved);a.replaceWith(replacement);const savedMessage=replacement.querySelector('[data-message]');savedMessage.textContent='Saved canonical server decision. Historical evidence unchanged.';savedMessage.tabIndex=-1;savedMessage.focus();onSaved(c.card_id);token=null;}catch(error){message.textContent=Tapio.error(error.message);preview.disabled=true;}};
 if(!writable||['STALE','BLOCKED','READ_ONLY'].includes(c.write_state)){action.disabled=true;preview.disabled=true;}
 form.append(preview,apply,output,message);a.append(form);return a;
}
async function load(){const seq=++generation;document.body.dataset.loaded='false';el('status').textContent='Loading authoritative current decisions…';el('cards').replaceChildren();el('batch').replaceChildren();el('progress').textContent='';
 try{const data=await get('cards');const current=await get('current');if(seq!==generation)return;if(current.batch_id!==data.batch_id)throw Error('Working set changed; refresh again.');csrf=data.csrf;
 const reviewed=new Set(data.cards.filter(c=>['CONFIRMED','CHANGED','SKIPPED'].includes(c.write_state)).map(c=>c.card_id));const progress=()=>el('progress').textContent=`Progress: ${reviewed.size} / ${data.cards.length} reviewed`;
 const onSaved=id=>{reviewed.add(id);progress();if(reviewed.size===data.cards.length)document.querySelectorAll('[data-next-window]').forEach(b=>b.disabled=!data.writes_enabled||data.queue?.pending_user_rules>0)};
 if(data.queue){const q=data.queue;el('batch').append(make('p',`${q.pending} pending · ${q.archived_windows} completed review windows`));}
 el('cards').replaceChildren(...data.cards.map(c=>renderCard(c,current.reviews[c.card_id],data.writes_enabled,onSaved)));progress();el('status').textContent=data.writes_enabled?'Current decisions loaded. Preview changes before applying.':'Read-only · changes are disabled pending verification.';document.body.dataset.loaded='true';
 }catch(error){if(seq===generation){el('cards').replaceChildren();el('status').textContent=error.message;document.body.dataset.loaded='false'}}}
el('refresh').onclick=load;window.addEventListener('pageshow',load);
</script></html>
