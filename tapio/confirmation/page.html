<!doctype html><html lang="en"><meta charset="utf-8"><title>Tapio human review</title>
<style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:1rem}article{border:1px solid #aaa;padding:1rem;margin:1rem 0}label{display:block;margin:.7rem 0}button,select{padding:.5rem;margin:.3rem}pre{white-space:pre-wrap}textarea{width:95%}.state{font-weight:bold}details{margin:.8rem 0}</style>
<h1>Persistent bounded human review</h1><a href="/pilot">Back</a>
<p id="batch"></p><p id="progress"></p><p>Category and context are independent. Frozen evidence and suggestions are historical. Current decisions come from the server. Every write needs a preview and a separate final click. Tax treatment remains a separate human decision.</p>
<button id="refresh" type="button">Refresh current decisions</button><p id="status" role="status">Loading…</p><div id="cards"></div>
<script>
const el=id=>document.getElementById(id), make=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
const categories=['ELECTRICITY','GRID_DISTRIBUTION','FORESTRY_SERVICE','TIMBER_INCOME','TAX','GROCERIES','FUEL','INSURANCE','MAINTENANCE','TRANSFER','SUBSCRIPTION','TRAVEL','OTHER','UNKNOWN'];
const fields=['category','context'];let csrf='',generation=0;
async function get(path){const r=await fetch('/pilot/confirmation/'+path,{cache:'no-store'});if(!r.ok)throw Error('Current review state unavailable');return r.json()}
async function post(path,body){const r=await fetch('/pilot/confirmation/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-Tapio-CSRF':csrf},body:JSON.stringify(body)});const v=await r.json();if(!r.ok)throw Error(v.detail||'Request failed');return v}
function renderCard(c,authoritative,writable,onSaved){
 if(!authoritative||fields.some(f=>!authoritative[f]))throw Error('Authoritative current decision missing');
 const a=make('article','');a.dataset.cardId=c.card_id;a.dataset.transactionId=authoritative.transaction_id;
 a.append(make('h2',c.transaction.merchant),make('p',`${c.transaction.date} · ${c.transaction.amount} ${c.transaction.currency||'EUR'}`));
 const status=make('p',c.write_state);status.className='state';status.setAttribute('role','status');a.append(status);
 const confirmed=fields.some(f=>authoritative[f].authority==='HUMAN_CONFIRMED');
 a.append(make('h3',confirmed?'FINAL HUMAN DECISION':'CURRENT REVIEW STATE'));
 for(const f of fields){const p=make('p',`${f==='category'?'Category':'Context'}: ${authoritative[f].value??'Unresolved'} · ${authoritative[f].field_status} · ${authoritative[f].authority}`);p.dataset.currentField=f;a.append(p)}
 a.append(make('p',`Review version: ${authoritative.review_version} · Audit event: ${authoritative.audit_event_id||'None'}`));
 a.append(make('h3','ORIGINAL SUGGESTION'),make('p',`Category: ${c.suggestion.category??'none'} · Context: ${c.suggestion.context??'none'} · SUGGESTED`));
 const evidence=make('details','');evidence.append(make('summary','Frozen source evidence, suggestions and rule provenance'));
 for(const key of ['source_messages','reasons','warnings','evidence','document_evidence','receipt_evidence','semantic_concepts','concept_candidates','user_rules','user_rule_conflicts','blocked_generalizations','uncertainty_history','review_signals','abstention_reasons'])if(c[key])evidence.append(make('pre',key+': '+JSON.stringify(c[key],null,2)));a.append(evidence);
 const form=make('form','');form.autocomplete='off';const action=make('select','');action.setAttribute('aria-label','Action');
 const addOption=(s,v,label)=>{const o=make('option',label);o.value=v;s.append(o)};addOption(action,'','Choose an action');
 const supported=fields.filter(f=>authoritative[f].value===null&&c.suggestion[f]!=null&&c.suggestion[f]!=='UNKNOWN');
 for(const f of supported)addOption(action,'CONFIRM_'+f.toUpperCase(),'CONFIRM SUGGESTED '+f.toUpperCase());if(supported.length===2)addOption(action,'CONFIRM_BOTH','CONFIRM BOTH');
 addOption(action,'CHANGE','CHANGE — choose labels yourself');addOption(action,'SKIP','SKIP — no classification');form.append(action);
 const controls={},dirty=new Set(),unknownSelections=new Set();let token=null;
 for(const f of fields){const label=make('label','Select '+f+': '),check=make('input',''),select=make('select','');check.type='checkbox';check.setAttribute('aria-label','Include '+f);select.setAttribute('aria-label',f);select.autocomplete='off';addOption(select,'','Unresolved — choose a value');for(const v of f==='category'?categories:['PERSONAL','PROPERTY','FORESTRY','UNKNOWN'])addOption(select,v,v);
 const value=authoritative[f].value??'';for(const o of select.options)o.defaultSelected=o.value===value;select.value=value;check.checked=false;check.disabled=select.disabled=true;
 select.addEventListener('change',()=>{dirty.add(f);if(select.value==='UNKNOWN')unknownSelections.add(f);else unknownSelections.delete(f);token=null;apply.disabled=true});label.prepend(check);label.append(select);form.append(label);controls[f]={check,select};}
 const note=make('textarea','');note.maxLength=500;note.setAttribute('aria-label','Correction reason');note.placeholder='Reason (required for correcting a previous confirmation)';form.append(note);
 const preview=make('button','Preview — no write');preview.type='submit';const apply=make('button','Apply displayed changes');apply.type='button';apply.disabled=true;
 const output=make('pre',''),message=make('p','');message.setAttribute('role','status');message.dataset.message='true';
 const invalidate=()=>{token=null;apply.disabled=true};form.addEventListener('input',invalidate);form.addEventListener('change',invalidate);
 action.onchange=()=>{dirty.clear();unknownSelections.clear();for(const [f,v] of Object.entries(controls)){const chosen=action.value==='CONFIRM_BOTH'||action.value==='CONFIRM_'+f.toUpperCase();v.check.checked=chosen;v.check.disabled=action.value!=='CHANGE';v.select.disabled=action.value!=='CHANGE';v.select.value=chosen?c.suggestion[f]:(authoritative[f].value??'')}invalidate()};
 form.onsubmit=async e=>{e.preventDefault();invalidate();if(!action.value){message.textContent='Choose an action first.';return}const selected={};
 try{if(action.value!=='SKIP')for(const [f,v] of Object.entries(controls))if(v.check.checked){if(v.select.value==='')throw Error('Choose a value or leave the field unchecked.');const changed=v.select.value!==authoritative[f].value;if(changed&&action.value==='CHANGE'&&!dirty.has(f))throw Error('UNCONFIRMED_UI_STATE_CHANGE');if(changed&&v.select.value==='UNKNOWN'&&!unknownSelections.has(f))throw Error('UNCONFIRMED_UI_STATE_CHANGE');selected[f]=v.select.value;}
 const p=await post('preview',{card_id:c.card_id,action:action.value.startsWith('CONFIRM')?'CONFIRM':action.value,fields:selected,correction_reason:note.value,review_version:authoritative.review_version,touched_fields:[...dirty],explicit_unknown_fields:[...unknownSelections]});output.textContent=JSON.stringify({CURRENT:p.current,ORIGINAL_SUGGESTION:p.suggested,USER_SELECTED:selected,WOULD_CHANGE:p.would_change,FIELD_OUTCOMES:p.field_outcomes},null,2);token=p.token;apply.disabled=!writable||!p.writes_enabled;message.textContent='Preview only. Review these changes, then apply.';
 }catch(error){message.textContent=error.message;if(/STALE/.test(error.message)){status.textContent='STALE — refresh current decisions';preview.disabled=true}}};
 apply.onclick=async()=>{if(!token)return;apply.disabled=true;preview.disabled=true;try{const result=await post('commit',{token,explicit_click:'APPLY_DISPLAYED_CHANGES'});if(!result.authoritative)throw Error('Missing canonical save response; refresh before retrying.');const updated={...c,write_state:result.status==='SKIPPED'?'SKIPPED':action.value==='CHANGE'?'CHANGED':'CONFIRMED'};const replacement=renderCard(updated,result.authoritative,writable,onSaved);a.replaceWith(replacement);replacement.querySelector('[data-message]').textContent='Saved canonical server decision. Historical evidence unchanged.';onSaved(c.card_id);token=null;}catch(error){message.textContent=error.message;preview.disabled=true;}};
 if(!writable||['STALE','BLOCKED','READ_ONLY'].includes(c.write_state)){action.disabled=true;preview.disabled=true;}
 form.append(preview,apply,output,message);a.append(form);return a;
}
async function load(){const seq=++generation;document.body.dataset.loaded='false';el('status').textContent='Loading authoritative current decisions…';el('cards').replaceChildren();el('batch').replaceChildren();el('progress').textContent='';
 try{const data=await get('cards');const current=await get('current');if(seq!==generation)return;if(current.batch_id!==data.batch_id)throw Error('Working set changed; refresh again.');csrf=data.csrf;
 const reviewed=new Set(data.cards.filter(c=>['CONFIRMED','CHANGED','SKIPPED'].includes(c.write_state)).map(c=>c.card_id));const progress=()=>el('progress').textContent=`Progress: ${reviewed.size} / ${data.cards.length} reviewed`;
 const onSaved=id=>{reviewed.add(id);progress();if(reviewed.size===data.cards.length)document.querySelectorAll('[data-next-window]').forEach(b=>b.disabled=!data.writes_enabled||data.queue?.pending_user_rules>0)};
 el('batch').append(make('p','Batch: '+data.batch_id));if(data.queue){const q=data.queue;el('batch').append(make('p',`Working set ${q.working_set_id} · ${q.pending} pending · ${q.archived_windows} archived windows`));for(const [label,path] of [['Semantic concepts','concepts'],['Category mappings','mappings'],['User rules','rules']]){const link=make('a',label+' · ');link.href='/pilot/confirmation/'+path;el('batch').append(link)}for(const refresh of [false,true]){const next=make('button',refresh?'Refresh stale working set':'Next bounded batch');next.dataset.nextWindow='true';next.disabled=!q.can_advance||!q.writes_enabled||q.pending_user_rules>0;next.onclick=async()=>{try{await post('queue/next',{window_id:q.working_set_id,explicit_click:'OPEN_NEXT_BOUNDED_WINDOW',refresh});await load()}catch(e){el('status').textContent=e.message}};el('batch').append(next)}}
 el('cards').replaceChildren(...data.cards.map(c=>renderCard(c,current.reviews[c.card_id],data.writes_enabled,onSaved)));progress();el('status').textContent=data.writes_enabled?'Current decisions loaded. Explicit bounded review enabled.':'READ_ONLY — writes disabled.';document.body.dataset.loaded='true';
 }catch(error){if(seq===generation){el('cards').replaceChildren();el('status').textContent=error.message;document.body.dataset.loaded='false'}}}
el('refresh').onclick=load;window.addEventListener('pageshow',load);
</script></html>
